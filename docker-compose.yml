services:
  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    # Only the backend sources and artifacts, so edits show up on restart while
    # the image keeps the client/build it compiled (a whole-repo mount hid it,
    # since client/build is gitignored on the host).
    volumes:
      - ./main.py:/app/main.py:ro
      - ./app:/app/app:ro
      - ./models:/app/models:ro
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
