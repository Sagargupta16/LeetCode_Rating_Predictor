name: Refresh training data

# Refreshes the training records weekly and publishes them to the Hugging Face
# Hub dataset (scripts/export_dataset.py). The records are no longer committed,
# so the only PR this opens is the regenerated docs/backtest.md.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A fine-grained token with write access to the dataset repo only.
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # astral-sh/setup-uv v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - run: uv sync --locked --no-install-project --no-build

      # The script exits non-zero when a run comes back with far fewer records
      # than the published dataset holds. That fails this job before anything
      # is uploaded, which is the point: a throttled fetch used to sail through
      # as a PR that deleted half the training set. Re-run the workflow; pass
      # --force only for an intended shrink.
      - name: Fetch latest contest data
        run: uv run --no-sync --no-build python scripts/update_data.py --baseline hub

      - name: Publish the dataset to the Hub
        run: uv run --no-sync --no-build python scripts/export_dataset.py --upload

      # Re-measure the served model on recent contests of users outside the
      # training slice, so the PR (and docs/backtest.md) carries a current
      # accuracy number. A throttled backtest must not block the data refresh,
      # and it only replaces docs/backtest.md when it finished.
      - name: Backtest the served model
        continue-on-error: true
        run: |
          uv run --no-sync --no-build python scripts/backtest.py --markdown > "$RUNNER_TEMP/backtest.md"
          mv "$RUNNER_TEMP/backtest.md" docs/backtest.md

      - name: Open a PR if the backtest changed
        # v7.0.8 ran `git remote prune origin` against checkout@v6's persisted
        # credentials, sending a duplicate Authorization header that GitHub
        # rejects with 400 (failed every scheduled run since 2026-08-17).
        # v7.0.11 restricted the prune to self-hosted runners; v8 targets
        # checkout@v6 and Node 24.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/refresh-training-data
          add-paths: docs/backtest.md
          commit-message: "docs: refresh the weekly backtest"
          title: "docs: refresh the weekly backtest"
          body: |
            Automated weekly run. `scripts/update_data.py` refreshed the
            training records and `scripts/export_dataset.py` published them to
            the Hugging Face Hub dataset; this PR only carries the new
            `docs/backtest.md` from `scripts/backtest.py` (recent contests of
            users outside the training data).

            Retraining is a separate, manual step: see CONTRIBUTING.md.
          labels: dependencies
          delete-branch: true
