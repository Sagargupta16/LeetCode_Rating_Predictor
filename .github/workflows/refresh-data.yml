name: Refresh training data

# scripts/update_data.py existed but nothing ran it, so data/data.json drifted
# out of date between manual runs. This refreshes it weekly and opens a PR for
# review rather than committing to main directly.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # astral-sh/setup-uv v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - run: uv sync --locked --no-install-project --no-build

      # The script refuses to overwrite data/data.json when a run comes back
      # with far fewer records than are already committed, and exits non-zero
      # instead. That fails this job and skips PR creation, which is the point:
      # a throttled fetch used to sail through as a PR that deleted half the
      # training set. Re-run the workflow; pass --force only for an intended
      # shrink.
      - name: Fetch latest contest data
        run: uv run --no-sync --no-build python scripts/update_data.py

      - name: Open a PR if the data changed
        # v7.0.8 ran `git remote prune origin` against checkout@v6's persisted
        # credentials, sending a duplicate Authorization header that GitHub
        # rejects with 400 (failed every scheduled run since 2026-08-17).
        # v7.0.11 restricted the prune to self-hosted runners; v8 targets
        # checkout@v6 and Node 24.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/refresh-training-data
          commit-message: "chore(data): refresh contest training data"
          title: "chore(data): refresh contest training data"
          body: |
            Automated weekly refresh of `data/data.json` via
            `scripts/update_data.py`.

            Retraining is a separate, manual step: see CONTRIBUTING.md. Merging
            this only updates the training inputs, not the served model.
          labels: dependencies
          delete-branch: true
