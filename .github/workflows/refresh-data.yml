name: Refresh training data

# scripts/update_data.py existed but nothing ran it, so data/data.json drifted
# out of date between manual runs. This refreshes it weekly and opens a PR for
# review rather than committing to main directly.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # astral-sh/setup-uv v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - run: uv sync --locked --no-install-project --no-build

      - name: Fetch latest contest data
        run: uv run --no-sync --no-build python scripts/update_data.py

      - name: Open a PR if the data changed
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: chore/refresh-training-data
          commit-message: "chore(data): refresh contest training data"
          title: "chore(data): refresh contest training data"
          body: |
            Automated weekly refresh of `data/data.json` via
            `scripts/update_data.py`.

            Retraining is a separate, manual step: see CONTRIBUTING.md. Merging
            this only updates the training inputs, not the served model.
          labels: dependencies
          delete-branch: true
