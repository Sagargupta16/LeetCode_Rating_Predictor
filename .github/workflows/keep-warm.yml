name: Keep demo warm on contest days

# The Render free tier sleeps after 15 idle minutes and takes 30-60 s to wake,
# which is exactly when people arrive: right after a contest ends, to check a
# prediction. Pinging /api/health every 10 minutes during those windows keeps it
# awake then, without holding it up all month. Free instance hours are shared
# by every free service on the account (750 per month), so a 24/7 ping would
# eat almost all of them; these two 6-hour windows add at most about 52.
#
#   Weekly contest:   Sunday 02:30 UTC  -> warm Sunday 02:00-07:59 UTC
#   Biweekly contest: Saturday 14:30 UTC (every other week; cron cannot say
#                     "every other", so every Saturday) -> 14:00-19:59 UTC
on:
  schedule:
    - cron: "*/10 2-7 * * 0"
    - cron: "*/10 14-19 * * 6"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          URL: https://leetcode-rating-predictor.onrender.com/api/health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            --max-time 90 --write-out '\nHTTP %{http_code} in %{time_total}s\n' "$URL"
