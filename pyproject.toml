[project]
name = "leetcode-rating-predictor"
version = "2.2.0"
description = "Neural network LeetCode contest rating predictor (FastAPI + TensorFlow)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "numpy==2.5.2",
    "joblib==1.5.3",
    "requests==2.34.2",
    "uvicorn[standard]==0.52.1",
    "scikit-learn==1.9.0",
    "httpx==0.28.1",
    "tqdm==4.70.0",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", "__pycache__", "client", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "N", "B", "S"]
ignore = [
    "S101",   # assert in tests is fine
    "S104",   # binding to 0.0.0.0 is intentional for server
    "S110",   # try-except-pass is used in model loader fallback
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
