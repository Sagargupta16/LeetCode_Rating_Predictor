[project]
name = "leetcode-rating-predictor"
version = "1.0.0"
description = "Neural network LeetCode contest rating predictor (FastAPI + TensorFlow)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi==0.133.1",
    "pydantic==2.12.5",
    "numpy==2.4.2",
    "joblib==1.5.3",
    "requests==2.33.0",
    "uvicorn[standard]==0.41.0",
    "scikit-learn==1.8.0",
    "httpx==0.28.1",
    "python-multipart==0.0.27",
    "tqdm==4.67.3",
    "redis==7.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv", "__pycache__", "client", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "N", "B", "S"]
ignore = [
    "S101",   # assert in tests is fine
    "S104",   # binding to 0.0.0.0 is intentional for server
    "S110",   # try-except-pass is used in model loader fallback
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
