[project]
name = "leetcode-rating-predictor"
version = "2.6.0"
description = "Neural network LeetCode contest rating predictor (FastAPI + NumPy inference)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "numpy==2.5.4",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]
# Training-only extras, mirroring requirements-ml.txt. Kept as an extra so
# uv.lock records hashes for them and the Docker build can install them
# verifiably. Never imported by the served application.
ml = [
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "huggingface-hub==2.4.0",
    "pyarrow==26.0.0",
]

# Mirrors requirements-dev.txt. uv sync installs this group by default, so CI
# can provision lint and test tooling straight from uv.lock. requests, tqdm,
# huggingface-hub and pyarrow are only imported by scripts/ (data refresh, Hub
# publishing, backtest), never by the API.
[dependency-groups]
dev = [
    "black==26.10.1",
    "ruff==0.17.3",
    "isort==9.0.2",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "huggingface-hub==2.4.0",
    "pyarrow==26.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# The repo is a flat layout with several non-package directories (data, models,
# client, notebooks), so setuptools cannot auto-discover what to package.
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
skip_glob = [".venv*/*", "venv/*", "client/*", "notebooks/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", ".venv-runtime", "venv", "__pycache__", "client", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "N", "B", "S"]
ignore = [
    "S101",   # assert in tests is fine
    "S104",   # binding to 0.0.0.0 is intentional for server
    "S110",   # try-except-pass is used in model loader fallback
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
