services:
  - type: web
    name: leetcode-rating-predictor
    runtime: python
    # No ML framework is installed: inference runs on numpy against the
    # exported artifacts in models/. See scripts/export_model.py.
    buildCommand: >
      pip install -r requirements.txt &&
      cd client && npm ci --ignore-scripts && npm run build
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: NODE_VERSION
        value: "22"
